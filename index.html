<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colapso Moral | Links</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace; /* Fuente tipo máquina de escribir */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .profile-pic {
            width: 100px;
            height: 100px;
            background-color: #333;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 2px solid #ff0000; /* Borde rojo punk */
        }
       /* ESTILO DEL LOGO (Actualizado) */
        .profile-pic {
            width: 120px; /* Un poco más grande */
            height: auto; /* Para que no se deforme */
            border-radius: 50%; /* Si quieres que siga siendo redondo */
            margin-bottom: 20px;
            /* Quitamos el fondo gris y el borde rojo para que tu logo brille solo */
        }

        /* TÍTULO CON GLITCH */
        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 5px;
            position: relative;
            cursor: pointer; /* Manita al pasar mouse */
        }

        /* El efecto al pasar el mouse */
        h1:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            color: #d60000; /* Se pone rojo sangre */
            text-shadow: 2px 2px #00fff2, -2px -2px #f000ff; /* Efecto 3D Roto */
        }

        /* La Animación del Temblor */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        p {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .link-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            background-color: #111;
            color: #fff;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            border: 1px solid #333;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #d60000; /* Rojo al pasar el mouse */
            color: #000;
            border-color: #d60000;
            transform: scale(1.02);
            box-shadow: 0 0 10px #d60000; /* Resplandor neón */
        }
        .footer {
            margin-top: 40px;
            font-size: 0.7rem;
            color: #444;
        }
    </style>
</head>
<body>

    <img src="logo.png.png" class="profile-pic" alt="Logo Colapso Moral">

    <h1>Colapso Moral</h1>
    <p>💀PROXIMAMENTE💀.</p>

    <div class="link-container">
        <a href="#" class="btn">🔥 Ver Colección 2026</a>
        <a href="https://wa.me/528141480156" class="btn">💀 Pedidos WhatsApp</a>
        <a href="#" class="btn">📍 Ubicación Secreta</a>
        <a href="#" class="btn">🎸 Playlist Oficial</a>
    </div>

    <div class="footer">
        © 2026 Colapso Moral. No seré, no seré...
    </div>

</body>
</html>
